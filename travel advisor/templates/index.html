{% extends "base.html" %}
{% block content %}

<div class="card">
  <h2 style="margin-bottom:10px;">Plan Your Trip</h2>
  <form id="searchForm">
    <div class="form-row">
      <div class="form-group">
        <label for="mood">Your Mood / Interest</label>
        <input type="text" id="mood" name="mood" placeholder="e.g., adventurous, relaxed, romantic" required>
      </div>

      <div class="form-group">
        <label for="budget">Budget (₹)</label>
        <input type="number" id="budget" name="budget" placeholder="e.g., 25000">
      </div>

      <div class="form-group">
        <label for="days">Trip Duration (days)</label>
        <input type="number" id="days" name="days" placeholder="e.g., 5">
      </div>

      <div class="form-group">
        <label for="source">Your Current Location</label>
        <input type="text" id="source" name="source" placeholder="e.g., Delhi">
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="btn btn-primary">Find Destinations</button>
      <button type="reset" class="btn btn-ghost">Reset</button>
    </div>
  </form>
</div>

<div id="status" style="margin-bottom:16px; font-size:14px; color:#4b5563;"></div>

<div class="results" id="results">
  <div class="empty">Start by entering your mood and preferences above 👆</div>
</div>

{% endblock %}
